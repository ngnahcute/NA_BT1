<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Task Manager - Quản lý công việc cá nhân</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <div>
        <h1>Mini Task Manager</h1>
        <p>Ứng dụng quản lý công việc cá nhân hiện đại</p>
      
  </header>

  <main class="container main-layout">
    <!-- Phần A: Form thêm công việc -->
    <section class="card form-card">
      <h2>Thêm công việc mới</h2>
      <form id="task-form">
        <div class="form-group">
          <label for="task-title">Tên công việc <span class="required">*</span></label>
          <input type="text" id="task-title" placeholder="Nhập tên công việc...">
          <small id="error-title" class="error-msg"></small>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-date">Hạn hoàn thành</label>
            <!-- Thêm thuộc tính min động hoặc tĩnh để chặn chọn ngày quá khứ trên giao diện -->
            <input type="date" id="task-date">
            <small id="error-date" class="error-msg"></small>
          </div>

          <div class="form-group">
            <label for="task-priority">Mức độ ưu tiên</label>
            <select id="task-priority">
              <option value="Thấp">Thấp</option>
              <option value="Trung bình" selected>Trung bình</option>
              <option value="Cao">Cao</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Thêm Công Việc</button>
      </form>
    </section>

    <!-- Phần A: Tìm kiếm, lọc và Vùng hiển thị danh sách -->
    <section class="card content-card">
      <div class="toolbar">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Tìm kiếm theo tên công việc...">
        </div>
        <div class="filter-box">
          <select id="filter-status">
            <option value="all">Tất cả trạng thái</option>
            <option value="pending">Chưa hoàn thành</option>
            <option value="done">Đã hoàn thành</option>
          </select>
        </div>
      </div>

      <div class="task-stats">
        <span id="task-count">Hiển thị 5 công việc</span>
      </div>

      <div class="table-responsive">
        <table class="task-table">
          <thead>
            <tr>
              <th>STT</th>
              <th>Tên công việc</th>
              <th>Hạn hoàn thành</th>
              <th>Ưu tiên</th>
              <th>Trạng thái</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="task-list">
            <!-- Dữ liệu được render động bằng JavaScript -->
          </tbody>
        </table>
      </div>
      <div id="empty-state" class="empty-state hidden">Không tìm thấy công việc phù hợp!</div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      Sinh viên: Lê Trần Ngọc Anh  |  MSSV: 224001708  |  Lớp: TUD D2024
    </div>
  </footer>
</body>
</html>
